<style>
:root{--bg:#f3f5f9;--ink:#172033;--muted:#5b6678;--line:#dce2eb;--blue:#2856c7;--pale:#edf2ff}*{box-sizing:border-box}body{margin:0;padding:22px 13px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Arial,sans-serif}main{max-width:900px;margin:auto;background:white;border-radius:18px;padding:clamp(17px,4vw,32px);box-shadow:0 8px 32px #16213a12}h1{font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.2;margin:0 0 8px}.intro,.muted{color:var(--muted)}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.9rem}.track{height:8px;background:#e8ebf1;border-radius:10px;margin:12px 0 22px;overflow:hidden}.fill{height:100%;width:0;background:var(--blue);transition:width .2s}.q{border:1px solid var(--line);border-radius:13px;padding:17px;margin:14px 0}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.83rem;gap:10px}.qt{font-weight:700;margin:12px 0;line-height:1.45}.choice{display:flex;gap:11px;width:100%;text-align:left;padding:12px;margin-top:8px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);font-size:.96rem;cursor:pointer}.choice:hover{background:#f7f8fc}.choice.sel{border:2px solid var(--blue);background:var(--pale)}.choice.good{border:2px solid #16834a;background:#eaf8f0}.choice.bad{border:2px solid #c43d3d;background:#fff0f0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}button.action{border:0;border-radius:10px;padding:13px 18px;background:var(--blue);color:white;font-weight:700;font-size:1rem;cursor:pointer}button.alt{background:white;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.55;cursor:not-allowed}.explain{margin-top:12px;font-size:.92rem;color:#465267}.score{background:var(--pale);border-radius:13px;padding:20px;margin-top:20px}.score strong{font-size:2.2rem}@media(max-width:520px){body{padding:10px}main{border-radius:12px}.choice{font-size:.92rem}}
</style></head><body><main><h1>Gazdasági ismeretek – emelt szintű próbaérettségi</h1><p class="intro">50 egyedi kérdés · Közgazdaságtan, makroökonómia, vállalkozás, számvitel, pénzügyek és üzleti tervezés.</p><div class="top"><span>Válaszolj minden kérdésre, majd értékeld ki a tesztet.</span><b id="counter">0 / 50 megválaszolva</b></div><div class="track"><div class="fill" id="fill"></div></div><div id="questions"></div><div class="actions"><button class="action" id="submit">Teszt kiértékelése</button><button class="action alt" id="reset">Újrakezdés</button></div><div id="result" aria-live="polite"></div><p class="muted" style="font-size:.8rem;margin-top:24px">Összeállított gyakorlóteszt, nem hivatalos érettségi feladatsor.</p></main>
<script>
const data=[["Feleletválasztós", "Egy vállalat termelési értéke 18 millió Ft, anyagjellegű és egyéb külső ráfordításai 7 millió Ft. Mekkora a bruttó hozzáadott értéke?", "21 millió Ft|11 millió Ft|25 millió Ft|7 millió Ft", 1, "A bruttó hozzáadott érték a kibocsátás és a folyó termelőfelhasználás különbsége: 18 − 7 = 11 millió Ft."], ["Számítás", "Egy termék ára 12 000 Ft-ról 13 500 Ft-ra emelkedik. A keresett mennyiség 1 000 darabról 850 darabra csökken. Mennyi a kereslet árrugalmasságának egyszerű (kiinduló értékhez viszonyított) értéke?", "−0,8|−1,2|+1,2|−0,5", 1, "A mennyiségváltozás −15%, az árváltozás +12,5%; −15/12,5 = −1,2. A kereslet rugalmas."], ["Igaz vagy hamis", "Tökéletes verseny esetén az egyes vállalatok árelfogadók: egyetlen vállalat önmagában nem képes érdemben befolyásolni a piaci árat.", "Igaz|Hamis", 0, "A sok eladó, a homogén termék és a piacra lépés szabadsága mellett az egyedi vállalat árelfogadó."], ["Feleletválasztós", "Melyik állítás írja le helyesen a határköltséget?", "Az összes költség és az összes bevétel különbsége.|Egy további termékegység előállításával járó többletköltség.|Az átlagos fix költség.|A termelés leállításakor megtakarítható összes költség.", 1, "A határköltség azt mutatja meg, mennyivel változik az összköltség egy további egység előállításakor."], ["Számítás", "Egy vállalkozás fix költsége 900 000 Ft, az egységnyi eladási ár 5 000 Ft, az egységnyi változó költség 3 200 Ft. Hány darabnál van a fedezeti pont?", "400 db|500 db|562 db|750 db", 1, "Fedezeti mennyiség = fix költség / (ár − változó költség) = 900 000 / 1 800 = 500 db."], ["Igaz vagy hamis", "Ha a piaci ár a vállalat átlagos változó költsége alatt van, rövid távon általában célszerű leállítani a termelést.", "Igaz|Hamis", 0, "Ilyenkor az értékesítés még a változó költségeket sem fedezi, ezért a termelés folytatása növeli a veszteséget."], ["Feleletválasztós", "Melyik tényező okoz – minden más változatlansága mellett – jobbra tolódást egy normál jószág keresleti görbéjén?", "A fogyasztók jövedelmének növekedése.|A termék saját árának emelkedése.|A termelési adó növekedése.|A helyettesítő termék árának csökkenése.", 0, "Normál jószág esetén a jövedelem növekedése növeli a keresletet. A saját ár változása a görbén való elmozdulást okozza."], ["Feleletválasztós", "Melyik jellemző a természetes monopóliumra?", "A piacra lépés minden vállalat számára költségmentes.|A méretgazdaságosság miatt egyetlen nagy szolgáltató alacsonyabb átlagköltséggel láthatja el a piacot.|A termékek teljesen homogének és sok kis termelő kínálja őket.|A piacon kizárólag állami tulajdonú vállalat működhet.", 1, "Természetes monopóliumnál a nagy volumenű termelés költségelőnye miatt egy szolgáltató hatékonyabban működhet."], ["Igaz vagy hamis", "A pozitív externália olyan külső gazdasági hatás, amelyért a kedvezményezett nem feltétlenül fizet piaci ellenértéket.", "Igaz|Hamis", 0, "A pozitív externália harmadik feleknek okoz piaci tranzakción kívüli előnyt, például az oktatás társadalmi hasznait."], ["Feleletválasztós", "Melyik a GDP kiadási oldalú felírása nyitott gazdaságban?", "C + I + G + (X − M)|C + S + T|W + R + P + I|X + M − G", 0, "A GDP kiadási oldalon a fogyasztás, beruházás, kormányzati vásárlás és nettó export összege."], ["Számítás", "A nominális GDP 8 400 milliárd Ft, a GDP-deflátor 120 (bázisév = 100). Mennyi a reál-GDP a bázisévi árakon?", "7 000 milliárd Ft|8 400 milliárd Ft|10 080 milliárd Ft|6 800 milliárd Ft", 0, "Reál-GDP = nominális GDP / (deflátor/100) = 8 400 / 1,2 = 7 000 milliárd Ft."], ["Igaz vagy hamis", "A GDP tartalmazza a háztartások által saját célra végzett, piacon nem értékesített háztartási munkát teljes piaci értéken.", "Igaz|Hamis", 1, "A nem piaci háztartási munka jellemzően nem része a GDP-nek, mert nincs piaci tranzakció és megbízható piaci értékelés."], ["Feleletválasztós", "Melyik mutató fejezi ki legközvetlenebbül az áruk és szolgáltatások általános árszínvonalának változását a háztartások fogyasztási kosara alapján?", "Fogyasztóiár-index (CPI)|Munkanélküliségi ráta|GDP volumenindex|Fizetési mérleg egyenlege", 0, "A fogyasztóiár-index a háztartások által vásárolt reprezentatív termék- és szolgáltatáskosár árának változását méri."], ["Számítás", "A fogyasztóiár-index egyik évről a másikra 108-ról 113,4-re nő. Hány százalékos volt az adott időszaki infláció?", "4%|5%|5,4%|8%", 1, "(113,4 − 108) / 108 × 100 = 5%."], ["Feleletválasztós", "Melyik helyzet jellemzi a stagflációt?", "Magas gazdasági növekedés és csökkenő árszínvonal.|Magas infláció és stagnáló vagy visszaeső gazdasági teljesítmény.|Alacsony infláció és teljes foglalkoztatás.|Kizárólag költségvetési többlet.", 1, "A stagfláció a magas infláció és a gyenge gazdasági teljesítmény, gyakran magas munkanélküliség együttes jelenléte."], ["Igaz vagy hamis", "A strukturális munkanélküliség kialakulásához hozzájárulhat, hogy a munkavállalók képzettsége vagy földrajzi elhelyezkedése nem illeszkedik az álláshelyekhez.", "Igaz|Hamis", 0, "A strukturális munkanélküliség a munkaerő-kereslet és -kínálat szerkezeti eltéréséből eredhet."], ["Feleletválasztós", "Melyik tartozik a monetáris politika hagyományos eszközei közé?", "Személyi jövedelemadó kulcsának módosítása.|Jegybanki alapkamat módosítása.|Állami beruházások közvetlen növelése.|Nyugdíjkiadások átütemezése.", 1, "A jegybanki kamatpolitika a monetáris politika egyik fő eszköze."], ["Igaz vagy hamis", "A jegybanki kamat emelése – egyéb tényezők változatlansága mellett – általában fékezi a hitelkeresletet és az aggregált keresletet.", "Igaz|Hamis", 0, "A magasabb kamat drágítja a hitelfelvételt, és ösztönözheti a megtakarítást, így mérsékelheti a keresletet."], ["Feleletválasztós", "Melyik állítás igaz a költségvetési politika automatikus stabilizátoraira?", "Minden esetben külön parlamenti döntést igényelnek.|A gazdasági ciklusra reagálva, külön új intézkedés nélkül is módosítják a nettó adókat és transzfereket.|Csak a jegybank alkalmazhatja őket.|Kizárólag a külkereskedelmi mérleget befolyásolják.", 1, "Például recesszióban csökkenhet az adóbevétel és nőhetnek a munkanélküli-ellátások külön új döntés nélkül."], ["Számítás", "Egy állam adóbevétele 15 200 milliárd Ft, nem adójellegű bevétele 1 300 milliárd Ft, kiadása 17 100 milliárd Ft. Mekkora a költségvetési egyenleg?", "600 milliárd Ft többlet|600 milliárd Ft hiány|1 900 milliárd Ft hiány|1 300 milliárd Ft többlet", 1, "Bevétel összesen 16 500 milliárd Ft; egyenleg = 16 500 − 17 100 = −600 milliárd Ft."], ["Feleletválasztós", "Mit jelent az elsődleges költségvetési egyenleg?", "A kamatkiadásokkal növelt teljes hiányt.|A költségvetési egyenleget a kamatkiadások figyelmen kívül hagyásával.|A külkereskedelmi mérleg egyenlegét.|Az államadósság nominális értékét.", 1, "Az elsődleges egyenleg a kamatkiadások nélküli bevételek és kiadások különbsége."], ["Igaz vagy hamis", "A progresszív adózásnál a magasabb adóalapra magasabb marginális adókulcs vonatkozik.", "Igaz|Hamis", 0, "Progresszív rendszerben az adókulcs az adóalap növekedésével emelkedik, jellemzően sávosan."], ["Feleletválasztós", "Melyik állítás igaz az áfa gazdasági természetére?", "Közvetlen adó, amelyet kizárólag a vállalkozás nyereségére vetnek ki.|Közvetett fogyasztási adó, amelynek terhét végső soron jellemzően a végső fogyasztó viseli.|Vagyoni adó, amelyet az ingatlanokra vetnek ki.|Olyan járulék, amely kizárólag a munkabért terheli.", 1, "Az áfa a termékértékesítéshez és szolgáltatásnyújtáshoz kapcsolódó közvetett adó; a végső fogyasztó viseli a terhét."], ["Feleletválasztós", "Melyik állítás különbözteti meg helyesen a számviteli és a gazdasági profitot?", "A gazdasági profit figyelembe veszi az explicit és implicit költségeket is.|A számviteli profit mindig kisebb a gazdasági profitnál.|A gazdasági profit nem veszi figyelembe a költségeket.|A két fogalom minden esetben azonos.", 0, "A gazdasági profit az alternatív költségeket, vagyis az implicit költségeket is levonja."], ["Számítás", "Egy vállalkozás árbevétele 48 millió Ft, az eladott áruk beszerzési értéke 29 millió Ft. Mennyi az árrés összege?", "19 millió Ft|29 millió Ft|48 millió Ft|77 millió Ft", 0, "Árrés = nettó árbevétel − ELÁBÉ = 48 − 29 = 19 millió Ft."], ["Igaz vagy hamis", "A mérlegben az eszközök összértéke mindig megegyezik a források összértékével.", "Igaz|Hamis", 0, "A mérleg alapösszefüggése: eszközök = források."], ["Feleletválasztós", "Melyik tétel szerepel a saját tőke részeként?", "Szállítói kötelezettség.|Jegyzett tőke.|Rövid lejáratú bankhitel.|Vevőktől kapott előleg.", 1, "A jegyzett tőke a saját tőke egyik eleme."], ["Számítás", "Egy vállalkozás forgóeszközei 24 millió Ft-ot, rövid lejáratú kötelezettségei 16 millió Ft-ot tesznek ki. Mennyi a likviditási ráta (current ratio)?", "0,67|1,0|1,5|2,5", 2, "Likviditási ráta = forgóeszközök / rövid lejáratú kötelezettségek = 24/16 = 1,5."], ["Feleletválasztós", "Mit mutat a gyorsráta (quick ratio) a likviditási elemzésben?", "A készletek arányát az összes eszközön belül.|A rövid lejáratú kötelezettségek fedezetét a készletek nélkül figyelembe vett likvid forgóeszközökkel.|A saját tőke arányát a jegyzett tőkéhez képest.|Az árbevétel és az adózott eredmény hányadosát.", 1, "A gyorsráta a készletek nélküli, gyorsan pénzzé tehető forgóeszközöket viszonyítja a rövid lejáratú kötelezettségekhez."], ["Igaz vagy hamis", "Az értékcsökkenési leírás a tárgyi eszköz bekerülési értékének hasznos élettartam alatti, terv szerinti költségként történő elszámolását szolgálhatja.", "Igaz|Hamis", 0, "A terv szerinti értékcsökkenés az eszköz használatából eredő értékcsökkenést osztja fel a hasznos élettartamra."], ["Számítás", "Egy gép bekerülési értéke 12 millió Ft, maradványértéke 2 millió Ft, hasznos élettartama 5 év. Lineáris leírással mennyi az éves értékcsökkenés?", "1,6 millió Ft|2 millió Ft|2,4 millió Ft|2,8 millió Ft", 1, "(12 − 2) / 5 = 2 millió Ft évente."], ["Feleletválasztós", "Melyik pénzáramlás tartozik a működési cash flow-hoz?", "Gép beszerzésére kifizetett összeg.|Vevőktől befolyó pénz az értékesítés ellenértékeként.|Hosszú lejáratú hitel felvétele.|Osztalékfizetés a tulajdonosoknak.", 1, "A vevőktől származó működési bevétel a napi üzletmenethez kapcsolódó pénzáramlás."], ["Igaz vagy hamis", "A nyereséges vállalkozásnak minden esetben pozitív a működési cash flow-ja is.", "Igaz|Hamis", 1, "A számviteli eredmény és a pénzáramlás eltérhet például a vevőkövetelések, készletek és szállítói tartozások változása miatt."], ["Feleletválasztós", "Melyik finanszírozási forma növeli közvetlenül a vállalkozás idegen tőkéjét?", "Új részvény kibocsátása.|Tulajdonosi pótbefizetés.|Bankhitel felvétele.|Visszatartott adózott eredmény.", 2, "A bankhitel visszafizetendő kötelezettség, ezért idegen forrás."], ["Számítás", "Egy kötvény névértéke 100 000 Ft, éves kuponja 6%. Mennyi az éves kuponfizetés?", "600 Ft|6 000 Ft|10 000 Ft|60 000 Ft", 1, "100 000 × 0,06 = 6 000 Ft."], ["Igaz vagy hamis", "A kötvény tulajdonosa a kibocsátó hitelezője, míg a részvény tulajdonosa részesedést szerez a társaságban.", "Igaz|Hamis", 0, "A kötvény hitelviszonyt, a részvény tulajdonosi részesedést testesít meg."], ["Feleletválasztós", "Melyik állítás igaz a diverzifikációra?", "A befektetés teljes összegének egyetlen eszközbe helyezése.|A befektetés megosztása különböző eszközök között az egyedi kockázat mérséklésére.|A befektetés kizárólag készpénzben tartása.|A hozam garantálása.", 1, "A diverzifikáció csökkentheti az egyedi eszközökhöz kapcsolódó kockázatot, de a piaci kockázatot nem szünteti meg."], ["Feleletválasztós", "Mit jelent a reálkamat?", "A nominális kamat és az infláció kapcsolatából adódó, vásárlóerő-változással korrigált kamatlábat.|A bank által felszámított kezelési költséget.|A jegybanki alapkamat és az árfolyam különbségét.|A betét névértékét.", 0, "A reálkamat az infláció hatását kiszűrő kamatláb; közelítőleg nominális kamat mínusz infláció."], ["Számítás", "Egy betét nominális éves kamata 9%, az éves infláció 5%. A közelítő reálkamat mennyi?", "4%|5%|9%|14%", 0, "Közelítő reálkamat = 9% − 5% = 4%."], ["Igaz vagy hamis", "A valuta külföldi pénz fizikai formában, míg a deviza külföldi pénznemben fennálló követelés vagy számlapénz is lehet.", "Igaz|Hamis", 0, "A hagyományos magyar pénzügyi szóhasználatban a valuta készpénz, a deviza számlapénz vagy más nem készpénzes külföldi pénzeszköz."], ["Feleletválasztós", "Ha a hazai valuta leértékelődik az euróval szemben, minden más tényező változatlansága mellett mi történhet?", "Az importált termékek hazai pénzben számított ára csökkenhet.|Az importált termékek hazai pénzben számított ára emelkedhet.|A hazai export automatikusan megszűnik.|A devizaárfolyamnak nincs hatása az importra.", 1, "A külföldi pénznemben meghatározott importár több hazai pénzt igényelhet leértékelődés után."], ["Igaz vagy hamis", "A folyó fizetési mérleg része az áruk és szolgáltatások külkereskedelmi egyenlege, valamint a jövedelmek és folyó transzferek egyenlege.", "Igaz|Hamis", 0, "A folyó fizetési mérleg fő részei az áruk, szolgáltatások, elsődleges jövedelmek és másodlagos jövedelmek."], ["Feleletválasztós", "Melyik állítás írja le legpontosabban a komparatív előny elvét?", "Egy ország akkor is szakosodhat egy termékre, ha annak előállításában abszolút hátránya van, amennyiben az alternatív költsége relatíve kisebb.|Csak az exporttöbblettel rendelkező országok kereskedhetnek.|A komparatív előny kizárólag a termelékenység abszolút szintjétől függ.|A vámok mindig növelik a komparatív előnyt.", 0, "A komparatív előny alapja az alacsonyabb alternatív költség, nem feltétlenül a nagyobb abszolút termelékenység."], ["Számítás", "A vállalkozás 10 millió Ft értékben értékesít, ebből 2 millió Ft a visszáru és árengedmény. Mennyi a nettó árbevétel, ha az összegek áfa nélkül értendők?", "8 millió Ft|10 millió Ft|12 millió Ft|20 millió Ft", 0, "Nettó árbevétel = értékesítés bruttó összege − visszáru és engedmény = 8 millió Ft."], ["Feleletválasztós", "Melyik mutató méri az adózott eredmény árbevételhez viszonyított arányát?", "Eszközarányos jövedelmezőség (ROA).|Árbevétel-arányos jövedelmezőség (ROS).|Likviditási ráta.|Eladósodottsági mutató.", 1, "ROS = adózott eredmény / nettó árbevétel, százalékban kifejezve."], ["Igaz vagy hamis", "A fedezeti hozzájárulásból először a fix költségeket kell fedezni; az ezt meghaladó rész járul hozzá az üzemi eredményhez.", "Igaz|Hamis", 0, "A fedezeti hozzájárulás az árbevétel és a változó költségek különbsége."], ["Számítás", "Egy vállalkozás árbevétele 30 millió Ft, változó költsége 18 millió Ft, fix költsége 8 millió Ft. Mennyi az üzemi eredmény egyszerűsített modellben?", "2 millió Ft|4 millió Ft|8 millió Ft|12 millió Ft", 1, "30 − 18 − 8 = 4 millió Ft."], ["Feleletválasztós", "Melyik üzleti tervrész foglalkozik a célpiac méretével, a vevői igényekkel és a versenytársakkal?", "Marketing- és piacelemzés.|Személyzeti terv.|Pénzügyi terv.|Termelési ütemterv.", 0, "A piacelemzés tárja fel a keresletet, a célcsoportot és a versenykörnyezetet."], ["Igaz vagy hamis", "A beruházás nettó jelenértéke (NPV) a várható jövőbeni pénzáramlások jelenértékének és a kezdeti beruházási kiadásnak a különbsége.", "Igaz|Hamis", 0, "NPV = diszkontált pénzáramlások összege − kezdeti beruházási kiadás."], ["Számítás", "Egy projekt egy év múlva 1 100 000 Ft pénzáramlást hoz. Az elvárt éves hozam 10%, a kezdeti beruházás 950 000 Ft. Mennyi az NPV egyéves időtávon?", "50 000 Ft|100 000 Ft|150 000 Ft|−50 000 Ft", 0, "Jelenérték = 1 100 000/1,10 = 1 000 000 Ft; NPV = 1 000 000 − 950 000 = 50 000 Ft."]];let answers=Array(50).fill(null),finished=false;const box=document.getElementById('questions'),counter=document.getElementById('counter'),fill=document.getElementById('fill'),result=document.getElementById('result');
function render(){box.innerHTML='';data.forEach((q,i)=>{const card=document.createElement('section');card.className='q';const meta=document.createElement('div');meta.className='meta';const type=document.createElement('span');type.textContent=q[0];const num=document.createElement('span');num.textContent=(i+1)+' / 50';meta.append(type,num);card.append(meta);const title=document.createElement('div');title.className='qt';title.textContent=q[1];card.append(title);q[2].split('|').forEach((opt,j)=>{const b=document.createElement('button');b.type='button';b.className='choice'+(answers[i]===j?' sel':'');if(finished){b.disabled=true;if(j===q[3])b.classList.add('good');else if(answers[i]===j)b.classList.add('bad')}const letter=document.createElement('b');letter.textContent=q[2].split('|').length===2?(j===0?'I':'H'):String.fromCharCode(65+j)+'.';const txt=document.createElement('span');txt.textContent=opt;b.append(letter,txt);b.onclick=()=>{if(!finished){answers[i]=j;render()}};card.append(b)});if(finished){const ex=document.createElement('div');ex.className='explain';ex.textContent=(answers[i]===q[3]?'✓ Helyes. ':'✗ Helytelen. ')+q[4];card.append(ex)}box.append(card)});const n=answers.filter(x=>x!==null).length;counter.textContent=n+' / 50 megválaszolva';fill.style.width=(n*2)+'%'}
document.getElementById('submit').onclick=()=>{if(finished)return;const n=answers.filter(x=>x!==null).length;if(n!==50){result.textContent='Még '+(50-n)+' kérdésre nem válaszoltál. A kiértékeléshez töltsd ki mind az 50 kérdést.';return}finished=true;const score=answers.reduce((s,a,i)=>s+(a===data[i][3]?1:0),0),pct=score*2,grade=pct>=80?'Jeles':pct>=60?'Jó':pct>=40?'Közepes':pct>=25?'Elégséges':'Elégtelen';result.innerHTML='<div class="score"><div>Elért eredmény</div><strong>'+score+' / 50</strong><h2>'+pct+'% · '+grade+'</h2><p>A zöld keret a helyes választ, a piros a hibás választ jelöli. Minden kérdés alatt megtalálod a magyarázatot.</p></div>';document.getElementById('submit').disabled=true;render();result.scrollIntoView({behavior:'smooth'})};
document.getElementById('reset').onclick=()=>{answers=Array(50).fill(null);finished=false;result.innerHTML='';document.getElementById('submit').disabled=false;render()};render();
</script></body></html>
